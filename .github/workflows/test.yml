name: Test workflow

on:
    workflow_dispatch:
    push:
        branches:
            - "**"

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Send a test Geode webhook
              uses: ./geode
              with:
                  webhook-url: ${{ secrets.RELEASE_WEBHOOK }}
                  mod-json-path: "./geode/mod.json"
                  content: "-# <@!358673524661157897> | **Webhook test requested**"
                  changelog: |
                      - <cy>Fixed</c> some <cr>bugs</c>
                      - Probably still have like <c-0af7f7>a lot more bugs left to fix</c> in this mod to be totally honest lol
                      - Tweaked this one <co>pretty weird setting</c>
                      - Soggy mod <cg>incompatible</c>
                      - This was just a test :3c
