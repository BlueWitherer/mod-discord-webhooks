name: Test workflow

on:
    workflow_dispatch:
    push:
        branches:
            - "**"

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Send a test Geode webhook
              uses: ./geode
              with:
                  webhook-url: ${{ secrets.RELEASE_WEBHOOK }}
                  content: "-# <@!358673524661157897>"
                  changelog: |
                      - Fixed some bugs
                      - Probably still have like a lot more bugs left to fix in this mod to be totally honest lol
                      - Tweaked this one pretty weird setting
                      - Soggy mod incompatible
                      - This was just a test
